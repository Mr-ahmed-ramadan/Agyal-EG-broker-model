name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  fix-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fix-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew build --no-daemon

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agyal
          POSTGRES_PASSWORD: agyal
          POSTGRES_DB: agyal_broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agyal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: API + FIX gateway + bank simulator end to end
        run: ./scripts/e2e.sh
        env:
          DATABASE_URL: postgresql://agyal:agyal@localhost:5432/agyal_broker?schema=public

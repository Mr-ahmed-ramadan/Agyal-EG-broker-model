# Render blueprint for the hosted demo (see docs/DEPLOYMENT.md).
# Creates: the API (web service) and the FIX gateway + bank simulator
# (background worker). The database is on Neon (Frankfurt); the web apps
# are hosted on Vercel.
#
# Values marked `sync: false` are asked for when you create the blueprint.

services:
  - type: web
    name: agyal-api
    runtime: node
    region: frankfurt
    # Always-on: the API also processes inbound FIX messages in the background.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w packages/shared-types -w services/api
    startCommand: npm run start:prod -w services/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Neon connection string (direct, not "-pooler"), same value on both services.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: KMS_MASTER_KEY_LOCAL
        generateValue: true
      # Sign-in and confirmation codes are emailed through Resend until an SMS gateway is chosen.
      - key: OTP_DELIVERY
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # A sender on your Resend-verified domain, e.g. codes@agyal.net
      - key: EMAIL_FROM
        sync: false
      # Browser origins allowed to call the API: the landing page and the three apps.
      - key: CORS_ORIGINS
        value: https://egypt.agyal.net,https://invest.egypt.agyal.net,https://broker.egypt.agyal.net,https://admin.egypt.agyal.net
      # Used to build the shareable links for prospect demos.
      - key: PUBLIC_CLIENT_URL
        value: https://invest.egypt.agyal.net
      - key: PUBLIC_BROKER_URL
        value: https://broker.egypt.agyal.net
      # Where landing-page contact requests are emailed (comma-separated for several people).
      - key: CONTACT_TO
        sync: false
      # Demo only: lets ops confirm coupons/redemptions before their payment date.
      - key: DEMO_MODE
        value: "true"
      # First platform admin (created once by the seed).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Don't create the *@demo-broker.example staff; add real staff in the admin console.
      - key: SEED_DEMO_STAFF
        value: "false"

  - type: worker
    name: agyal-fix
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./services/fix-gateway/Dockerfile
    dockerContext: ./services/fix-gateway
    envVars:
      # Neon connection string (direct, not "-pooler"), same value on both services.
      - key: DATABASE_URL
        sync: false

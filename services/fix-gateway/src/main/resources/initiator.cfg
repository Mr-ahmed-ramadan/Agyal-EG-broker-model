# QuickFIX/J initiator: one [SESSION] per partner bank (ADR 0004).
# Local dev points at the bank simulator, which hosts two demo banks.

[DEFAULT]
ConnectionType=initiator
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ReconnectInterval=5
UseDataDictionary=Y
DataDictionary=FIX44.xml
FileStorePath=store/initiator
ResetOnLogon=Y
BeginString=FIX.4.4
SenderCompID=AGYAL
SocketConnectHost=localhost
SocketConnectPort=9880

[SESSION]
TargetCompID=SIMBANK

[SESSION]
TargetCompID=SIMBANK2
